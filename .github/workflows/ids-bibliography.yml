name: Extract IDS bibliography CSV

on:
  push:
    branches: [main]
    paths:
      - scripts/import_ids.py
      - .github/workflows/ids-bibliography.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Extract IDS bibliography
        run: python scripts/import_ids.py
      - name: Commit updated CSV (only if generated)
        run: |
          if test -f data/publications_ids.csv; then
            git add data/publications_ids.csv
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "data: import IDS bibliography [skip ci]"
              git push
            fi
          fi
