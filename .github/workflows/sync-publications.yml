name: Sync ORCID publications and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 6 * * 1' # Every Monday, 06:13 UTC
  workflow_dispatch:

permissions:
  contents: write # Keep the last verified ORCID snapshot in the repository
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ORCID parser
        run: python -m unittest discover -s tests -v
      - name: Refresh public ORCID works
        env:
          ORCID_ACCESS_TOKEN: ${{ secrets.ORCID_ACCESS_TOKEN }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python scripts/fetch_orcid.py
      - name: Save latest publication snapshot to main
        run: |
          git add data/publications.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh ORCID bibliography [skip ci]"
            git push || echo '::warning::Could not persist snapshot; continuing with generated site artifact.'
          fi
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
